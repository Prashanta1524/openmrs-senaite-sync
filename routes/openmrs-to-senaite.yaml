# camel-k: language=yaml

- from:
    uri: "kafka:dbserver1.openmrs.person_name?brokers=kafka:29092&autoOffsetReset=earliest&groupId=patient-sync-v2001"
    steps:
      - setHeader:
          name: "op"
          jsonpath: "$.payload.op"
      - choice:
          when:
            - simple: "${header.op} == 'c' || ${header.op} == 'r' || ${header.op} == 'u'"
              steps:
                - setHeader:
                    name: "personId"
                    jsonpath: "$.payload.after.person_id"
                - setHeader:
                    name: "firstName"
                    jsonpath: "$.payload.after.given_name"
                - setHeader:
                    name: "lastName"
                    jsonpath: "$.payload.after.family_name"

                - setHeader:
                    name: "CamelHttpMethod"
                    constant: "GET"
                - setHeader:
                    name: "Authorization"
                    constant: "Basic YWRtaW46YWRtaW4="
                
                # Check if patient exists using ClientID
                - toD: "http://openmrs-distro-referenceapplication-senaite-1:8080/senaite/@@API/senaite/v1/search?ClientID=omrs-${header.personId}"
                
                - setHeader:
                    name: "exists"
                    jsonpath:
                      expression: "$.items[0].uid"
                      suppressExceptions: true

                - choice:
                    when:
                      - simple: "${header.exists} == null"
                        steps:
                          - log: ">>> Creating New Patient: omrs-${header.personId}"
                          - setHeader:
                              name: "CamelHttpMethod"
                              constant: "POST"
                          - setHeader:
                              name: "Content-Type"
                              constant: "application/json"
                          - setBody:
                              simple: |
                                {
                                  "portal_type": "Client", 
                                  "parent_path": "/senaite/clients", 
                                  "ClientID": "omrs-${header.personId}", 
                                  "Name": "${header.firstName} ${header.lastName}"
                                }
                          - to: "http://openmrs-distro-referenceapplication-senaite-1:8080/senaite/@@API/senaite/v1/create?throwExceptionOnFailure=false"
                          - log: "PATIENT CREATED: ${body}"
                    otherwise:
                      steps:
                        - log: ">>> Patient omrs-${header.personId} already exists. Skipping."