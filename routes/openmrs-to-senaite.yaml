- from:
    uri: "kafka:dbserver1.openmrs.person_name?brokers=kafka:29092"
    steps:
      - setHeader:
          name: "op"
          jsonpath: "$['payload']['op']"
      - choice:
          when:
            - simple: "${header.op} == 'c'"
              steps:
                - setHeader:
                    name: "givenName"
                    jsonpath: "$['payload']['after']['given_name']"
                - setHeader:
                    name: "familyName"
                    jsonpath: "$['payload']['after']['family_name']"
                - setHeader:
                    name: "personId"
                    jsonpath: "$['payload']['after']['person_id']"
                
                - log: "Syncing Patient: ${header.givenName} (omrs-${header.personId})"

                - setBody:
                    simple: |
                      {
                        "@type": "Client",
                        "id": "omrs-${header.personId}",
                        "ClientID": "omrs-${header.personId}",
                        "title": "${header.givenName} ${header.familyName}",
                        "Name": "${header.givenName} ${header.familyName}"
                      }
                - setHeader:
                    name: "Authorization"
                    constant: "Basic YWRtaW46YWRtaW4="
                - setHeader:
                    name: "Content-Type"
                    constant: "application/json"
                - setHeader:
                    name: "Accept"
                    constant: "application/json"
                
                # We POST to the clients folder. 
                - to: "http://senaite:8080/senaite/clients?throwExceptionOnFailure=false"
                
                - log: "SENAITE PATIENT RESPONSE: ${body}"