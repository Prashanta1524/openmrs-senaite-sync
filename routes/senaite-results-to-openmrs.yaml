# camel-k: language=yaml

- from:
    uri: "timer:te-results-poll?period=10000&delay=5000"
    steps:
      - log: "--- POLLING SENAITE FOR PUBLISHED RESULTS ---"
      
      - setHeader:
          name: "CamelHttpMethod"
          constant: "GET"
      - setHeader:
          name: "Authorization"
          constant: "Basic YWRtaW46YWRtaW4="
      
      - to: "http://openmrs-distro-referenceapplication-senaite-1:8080/senaite/@@API/senaite/v1/search?portal_type=Analysis&review_state=published&include_fields=Result,getResult,ClientOrderNumber,parent_id&include_parent=true"

      - split:
          jsonpath: "$.items[*]"
          steps:
            # --- START WORKING SENAITE LOGIC ---
            - setHeader:
                name: "senaiteResult"
                expression:
                  jsonpath:
                    expression: "$.Result"
                    suppress-exceptions: true
            - choice:
                when:
                  - simple: "${header.senaiteResult} == null || ${header.senaiteResult} == ''"
                    steps:
                      - setHeader:
                          name: "senaiteResult"
                          expression:
                            jsonpath:
                              expression: "$.getResult"
                              suppress-exceptions: true

            - setHeader:
                name: "orderNumber"
                expression:
                  jsonpath:
                    expression: "$.ClientOrderNumber"
                    suppress-exceptions: true
            - choice:
                when:
                  - simple: "${header.orderNumber} == null || ${header.orderNumber} == ''"
                    steps:
                      - setHeader:
                          name: "orderNumber"
                          expression:
                            jsonpath:
                              expression: "$.parent_id"
                              suppress-exceptions: true
            # --- END WORKING SENAITE LOGIC ---

            - choice:
                when:
                  - simple: "${header.orderNumber} != null && ${header.senaiteResult} != null && ${header.orderNumber} regex '^(ORD|CBC)-.*'"
                    steps:
                      - log: ">>> DATA IDENTIFIED: Order=${header.orderNumber}, Result=${header.senaiteResult}. Connecting to OpenMRS..."

                      - setHeader:
                          name: "Authorization"
                          constant: "Basic YWRtaW46QWRtaW4xMjM="
                      - setHeader:
                          name: "CamelHttpMethod"
                          constant: "GET"
                      
                      # FIX 1: Clear the body so the GET request is clean. 
                      # This prevents the 400 error caused by sending SENAITE JSON to OpenMRS.
                      - setBody:
                          constant: null
                      
                      # FIX 2: Use 'orderNumber=' instead of 'q=' for OpenMRS Order lookup.
                      - toD: "http://openmrs-distro-referenceapplication-backend-1:8080/openmrs/ws/rest/v1/order?orderNumber=${header.orderNumber}&v=full"

                      # FIX 3: Added suppress-exceptions to these jsonpaths 
                      # so the route doesn't crash if OpenMRS returns no results.
                      - setHeader:
                          name: "patientUuid"
                          expression:
                            jsonpath:
                              expression: "$.results[0].patient.uuid"
                              suppress-exceptions: true
                      - setHeader:
                          name: "conceptUuid"
                          expression:
                            jsonpath:
                              expression: "$.results[0].concept.uuid"
                              suppress-exceptions: true
                      - setHeader:
                          name: "orderUuid"
                          expression:
                            jsonpath:
                              expression: "$.results[0].uuid"
                              suppress-exceptions: true
                      - setHeader:
                          name: "encounterUuid"
                          expression:
                            jsonpath:
                              expression: "$.results[0].encounter.uuid"
                              suppress-exceptions: true

                      - choice:
                          when:
                            - simple: "${header.patientUuid} != null"
                              steps:
                                - setHeader:
                                    name: "CamelHttpMethod"
                                    constant: "POST"
                                - setHeader:
                                    name: "Content-Type"
                                    constant: "application/json"
                                - setBody:
                                    simple: |
                                      {
                                        "person": "${header.patientUuid}",
                                        "concept": "${header.conceptUuid}",
                                        "value": ${header.senaiteResult},
                                        "order": "${header.orderUuid}",
                                        "encounter": "${header.encounterUuid}",
                                        "obsDatetime": "${date:now:yyyy-MM-dd'T'HH:mm:ss.SSSZ}"
                                      }
                                - to: "http://openmrs-distro-referenceapplication-backend-1:8080/openmrs/ws/rest/v1/obs"
                                - log: ">>> SUCCESS: ${header.orderNumber} result saved to OpenMRS."
                          otherwise:
                            steps:
                              - log: ">>> WARNING: Order ${header.orderNumber} not found in OpenMRS system."
                otherwise:
                  steps:
                    - log: ">>> DEBUG: Found Analysis item. Order ID: '${header.orderNumber}', Result: '${header.senaiteResult}'"