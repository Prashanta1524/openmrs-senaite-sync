- from:
    uri: "kafka:dbserver1.openmrs.orders?brokers=kafka:29092"
    steps:
      - setHeader:
          name: "op"
          jsonpath: "$['payload']['op']"
      - choice:
          when:
            - simple: "${header.op} == 'c' || ${header.op} == 'r'"
              steps:
                - setHeader:
                    name: "conceptId"
                    jsonpath: "$['payload']['after']['concept_id']"
                - setHeader:
                    name: "orderNumber"
                    jsonpath: "$['payload']['after']['order_number']"
                - setHeader:
                    name: "patientId"
                    jsonpath: "$['payload']['after']['patient_id']"
                
                - log: "Syncing Lab Order: ${header.orderNumber} for Patient: omrs-${header.patientId}"

                # BUILD JSON
                # PASTE YOUR UIDs BELOW
                - setBody:
                    simple: |
                      {
                        "portal_type": "AnalysisRequest",
                        "parent_path": "/senaite/clients/omrs-${header.patientId}",
                        "ClientSampleID": "${header.orderNumber}",
                        "Contact": "37d6761c2ddb4bc284d26579c31f2940",
                        "SampleType": "dd25b457e62a4469863870adc7167324",
                        "Analyses": ["49970b1caf72446292a5704393016a4c"],
                        "DateSampled": "${date:now:yyyy-MM-dd HH:mm}"
                      }

                - setHeader:
                    name: "Content-Type"
                    constant: "application/json"
                - setHeader:
                    name: "Accept"
                    constant: "application/json"
                - setHeader:
                    name: "Authorization"
                    constant: "Basic YWRtaW46YWRtaW4="
                - setHeader:
                    name: "CamelHttpMethod"
                    constant: "POST"
                
                # The API endpoint
                - setHeader:
                    name: "CamelHttpUri"
                    simple: "http://senaite:8080/senaite/@@API/senaite/v1/create"
                
                - to: "http://senaite:8080?throwExceptionOnFailure=false"
                
                - log: "SENAITE ORDER RESPONSE: ${body}"